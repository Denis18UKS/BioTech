name: Build BioTech fixed sources

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Package fixed sources
        if: success()
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/BioTech-fixed-sources.zip HEAD
          cp build/libs/*.jar dist/ || true

      - name: Upload build archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BioTech-fixed
          path: dist/*
          if-no-files-found: error
          retention-days: 14
