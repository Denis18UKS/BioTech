name: Build multiblock and DNA overhaul

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply feature patch
        shell: bash
        run: |
          cat ci_payload/feature_patch_00.b64 \
              ci_payload/feature_patch_01.b64 \
              ci_payload/feature_patch_02a.b64 \
              ci_payload/feature_patch_02b.b64 \
              ci_payload/feature_patch_02c.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/biotech-feature.patch
          patch --batch --forward -p1 < /tmp/biotech-feature.patch

      - name: Generate BioTech assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_biotech_assets.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Package fixed sources and JAR
        if: success()
        shell: bash
        run: |
          mkdir -p dist/source/BioTech
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='bin' \
            --exclude='run' \
            --exclude='dist' \
            --exclude='ci_payload' \
            ./ dist/source/BioTech/
          (cd dist/source && zip -qr ../BioTech-multiblock-dna-sources.zip BioTech)
          cp build/libs/*.jar dist/

      - name: Upload build archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BioTech-multiblock-dna
          path: dist/*
          if-no-files-found: error
          retention-days: 14
