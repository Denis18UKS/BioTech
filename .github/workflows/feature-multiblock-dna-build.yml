name: Build multiblock and DNA overhaul

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build marker
        shell: bash
        run: |
          cat > BUILD-INFO.txt <<'EOF'
          BioTech — переработка мультиблоков, энергии и ДНК

          Ветка: chatgpt/textures-shader-injector-fix
          Pull request: #3
          Minecraft: 1.21.1
          NeoForge: 21.1.247
          Java: 21
          EOF

      - name: Apply feature patch
        shell: bash
        run: |
          cat ci_payload/feature_patch_00.b64 \
              ci_payload/feature_patch_01.b64 \
              ci_payload/feature_patch_02a.b64 \
              ci_payload/feature_patch_02b.b64 \
              ci_payload/feature_patch_02c1.b64 \
              ci_payload/feature_patch_02c2.b64 \
              ci_payload/feature_patch_03.b64 \
              ci_payload/feature_patch_04.b64 \
              ci_payload/feature_patch_05.b64 \
              ci_payload/feature_patch_06.b64 \
              ci_payload/feature_patch_07.b64 \
              ci_payload/feature_patch_08.b64 \
            | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/biotech-feature.patch

          set +e
          patch --batch --forward -p1 < /tmp/biotech-feature.patch
          patch_status=$?
          set -e

          test -f src/main/java/neo/z_mods/biotech/network/DnaInjectorModePacket.java
          test -f src/main/java/neo/z_mods/biotech/client/DnaInjectorModeClientHandler.java
          test -f src/main/java/neo/z_mods/biotech/block/CableBlock.java
          test -f src/main/java/neo/z_mods/biotech/item/BioBatteryItem.java
          test -f src/main/java/neo/z_mods/biotech/multiblock/MultiblockAssembler.java
          test -f tools/generate_biotech_assets.py

          echo "patch exited with status ${patch_status}; pre-existing workflow/docs files are expected on the PR branch"

      - name: Generate BioTech assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow

          # The wrench has its own dedicated pixel-art texture and is intentionally
          # generated before the common validator runs.
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          target = Path('src/main/resources/assets/biotech/textures/item/assembly_wrench.png')
          target.parent.mkdir(parents=True, exist_ok=True)
          image = Image.new('RGBA', (32, 32), (0, 0, 0, 0))
          draw = ImageDraw.Draw(image)
          accent = (70, 231, 151, 255)
          draw.polygon([(5, 4), (11, 5), (14, 9), (12, 13), (16, 17), (20, 13),
                        (24, 14), (27, 20), (24, 26), (18, 28), (14, 24), (15, 20),
                        (11, 16), (7, 18), (3, 15), (4, 10), (8, 9)],
                       fill=(76, 88, 89, 255), outline=(18, 24, 25, 255))
          draw.line((8, 7, 24, 23), fill=(174, 188, 186, 255), width=3)
          draw.line((10, 9, 22, 21), fill=(91, 105, 104, 255), width=2)
          draw.rounded_rectangle((15, 16, 26, 28), radius=2, fill=(29, 38, 39, 255), outline=(118, 132, 130, 255))
          draw.rectangle((18, 19, 23, 25), fill=(26, 86, 59, 255), outline=accent)
          draw.rectangle((19, 20, 22, 23), fill=(94, 255, 178, 255))
          draw.line((5, 11, 11, 5), fill=(211, 220, 216, 255), width=2)
          draw.line((4, 14, 9, 17), fill=(45, 55, 56, 255), width=2)
          image.save(target, optimize=True)
          PY

          python tools/generate_biotech_assets.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Package fixed sources and JAR
        if: success()
        shell: bash
        run: |
          mkdir -p dist/source/BioTech
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='bin' \
            --exclude='run' \
            --exclude='dist' \
            --exclude='ci_payload' \
            ./ dist/source/BioTech/
          (cd dist/source && zip -qr ../BioTech-multiblock-dna-sources.zip BioTech)
          cp build/libs/*.jar dist/

      - name: Upload build archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BioTech-multiblock-dna
          path: dist/*
          if-no-files-found: error
          retention-days: 14
