name: Build standalone Cosmic Experiments

on:
  push:
    branches:
      - chatgpt/cosmic-experiments-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout technical build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore standalone v0.1 base
        shell: bash
        run: |
          git show 0255e907754e97194be6daa73457abbe1e2dea16:cosmic_ci/payload.part00 > /tmp/p0
          git show 0255e907754e97194be6daa73457abbe1e2dea16:cosmic_ci/payload.part01 > /tmp/p1
          cat /tmp/p0 /tmp/p1 | tr -d '\n\r' | base64 --decode > /tmp/cosmic.tar.gz
          mkdir -p /tmp/cosmic
          tar -xzf /tmp/cosmic.tar.gz -C /tmp/cosmic
          cp gradlew gradlew.bat /tmp/cosmic/CosmicExperiments/
          cp -r gradle /tmp/cosmic/CosmicExperiments/
          chmod +x /tmp/cosmic/CosmicExperiments/gradlew

      - name: Apply standalone v0.2 realism base
        shell: bash
        run: |
          cat cosmic_ci/v020_xz.part* | tr -d '\n\r' | base64 --decode > /tmp/cosmic-v020.tar.xz
          tar -xJf /tmp/cosmic-v020.tar.xz -C /tmp/cosmic
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/cosmic/CosmicExperiments')
          assert 'mod_version=0.2.0' in (root/'gradle.properties').read_text(encoding='utf-8')
          assert 'TRANSFER_DELAY_TICKS = 12' in (root/'src/main/java/neo/z_mods/cosmicexperiment/SpaceTravelManager.java').read_text(encoding='utf-8')
          print('clean v0.2 base restored')
          PY

      - name: Apply Cosmic Experiments v0.3 living-system overhaul
        shell: bash
        run: |
          cat cosmic_ci/v030_patch.part00 cosmic_ci/v030_patch.part01 cosmic_ci/v030_patch.part02 \
              cosmic_ci/v030_patch.part03 cosmic_ci/v030_patch.part04 cosmic_ci/v030_patch.part05 \
              | tr -d '\n\r' | base64 --decode | xz -dc > /tmp/cosmic-v030.patch
          cd /tmp/cosmic/CosmicExperiments
          patch --batch --forward -p5 < /tmp/cosmic-v030.patch
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/cosmic/CosmicExperiments')
          assert 'mod_version=0.3.0' in (root/'gradle.properties').read_text(encoding='utf-8')
          required = [
              'src/main/java/neo/z_mods/cosmicexperiment/AstronomyClock.java',
              'src/main/java/neo/z_mods/cosmicexperiment/HologramKind.java',
              'src/main/java/neo/z_mods/cosmicexperiment/HologramSystem.java',
              'src/main/java/neo/z_mods/cosmicexperiment/PlanetTerrainHandler.java',
              'src/main/java/neo/z_mods/cosmicexperiment/SingularitySystem.java',
              'src/main/resources/assets/cosmicexperiment/shaders/core/hologram.fsh',
              'src/main/resources/assets/cosmicexperiment/shaders/core/planet_sky.fsh',
          ]
          for rel in required:
              assert (root/rel).is_file(), rel
          solar = (root/'src/main/resources/assets/cosmicexperiment/shaders/core/solar_system.fsh').read_text(encoding='utf-8')
          for token in ['AstroDays', 'EarthRel', 'JupiterRel', 'SaturnRel', 'stableStarField']:
              assert token in solar, token
          hologram = (root/'src/main/resources/assets/cosmicexperiment/shaders/core/hologram.fsh').read_text(encoding='utf-8')
          for token in ['galaxyColor', 'id==20', 'id==21', 'id==22', 'id==23']:
              assert token in hologram, token
          manager = (root/'src/main/java/neo/z_mods/cosmicexperiment/SpaceTravelManager.java').read_text(encoding='utf-8')
          assert 'TRANSFER_DELAY_TICKS = 36' in manager
          for path in (root/'src/main/resources/assets/cosmicexperiment/shaders/core').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('v0.3 payload integrity OK')
          PY

      - name: Apply NeoForge 1.21.1 compatibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/cosmic/CosmicExperiments')

          p = root/'src/main/java/neo/z_mods/cosmicexperiment/SingularitySystem.java'
          s = p.read_text(encoding='utf-8')
          s = s.replace('level.getEntities(null, box, entity -> entity.isAlive()',
                        'level.getEntities((Entity) null, box, entity -> entity.isAlive()')
          s = s.replace('player.hurtServer(level, level.damageSources().magic(), distance < 7.0 ? 9.0F : 4.0F);',
                        'player.hurt(level.damageSources().magic(), distance < 7.0 ? 9.0F : 4.0F);')
          p.write_text(s, encoding='utf-8')

          p = root/'src/main/java/neo/z_mods/cosmicexperiment/HologramSystem.java'
          s = p.read_text(encoding='utf-8').replace('        marker.setMarker(true);\n', '')
          p.write_text(s, encoding='utf-8')

          p = root/'src/main/java/neo/z_mods/cosmicexperiment/PlanetTerrainHandler.java'
          s = p.read_text(encoding='utf-8')
          s = s.replace('        if (!(event.getChunk().getLevel() instanceof ServerLevel level)) return;\n',
                        '        if (!(event.getChunk() instanceof LevelChunk chunk)) return;\n        if (!(chunk.getLevel() instanceof ServerLevel level)) return;\n')
          s = s.replace('        sculpt(event.getChunk(), body);', '        sculpt(chunk, body);')
          p.write_text(s, encoding='utf-8')
          print('NeoForge compatibility fixes applied')
          PY

      - name: Generate custom navigator and experiment item textures
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          mkdir -p /tmp/cosmic/CosmicExperiments/tools
          cp cosmic_ci/generate_v030_item_textures.py /tmp/cosmic/CosmicExperiments/tools/generate_v030_item_textures.py
          python /tmp/cosmic/CosmicExperiments/tools/generate_v030_item_textures.py
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/cosmic/CosmicExperiments/src/main/resources/assets/cosmicexperiment')
          models = root/'models/item'
          textures = root/'textures/item'
          missing=[]
          for model in models.glob('*.json'):
              data=json.loads(model.read_text(encoding='utf-8'))
              layer=data.get('textures',{}).get('layer0')
              if not layer or not layer.startswith('cosmicexperiment:item/'):
                  continue
              name=layer.split('/')[-1]
              if not (textures/f'{name}.png').is_file():
                  missing.append((model.name,name))
          assert not missing, 'missing item textures: '+repr(missing)
          required=[f'navigate_{b}.png' for b in ['sun','mercury','venus','earth','moon','mars','jupiter','saturn','uranus','neptune']]
          required += ['spawn_andromeda_shader.png','spawn_milky_way_shader.png','spawn_supernova_shader.png','spawn_singularity_shader.png']
          for name in required:
              assert (textures/name).is_file(), name
          print('All item model textures resolved; v0.3 custom icons present')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone mod
        working-directory: /tmp/cosmic/CosmicExperiments
        run: ./gradlew build --stacktrace

      - name: Package JAR and sources
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/dist
          cp /tmp/cosmic/CosmicExperiments/build/libs/*.jar /tmp/dist/CosmicExperiments-v0.3.0.jar
          cd /tmp/cosmic
          zip -qr /tmp/dist/CosmicExperiments-v0.3.0-sources.zip CosmicExperiments \
            -x 'CosmicExperiments/.gradle/*' 'CosmicExperiments/build/*' 'CosmicExperiments/run/*'
          cat > /tmp/dist/README.txt <<'EOF'
          Cosmic Experiments v0.3.0 — standalone NeoForge 1.21.1 mod
          Separate from BioTech; technical CI branch only.
          v0.3: living orbital system, stable world-space stars, unique rocky-world terrain,
          floorless gas-giant atmospheres, world-space shader holograms, per-body navigators,
          Andromeda and Milky Way holograms, supernova test, optional Singularity gravity,
          and custom per-body navigator/experiment item textures.
          EOF

      - name: Upload standalone artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CosmicExperiments-v0.3.0-standalone
          path: /tmp/dist/*
          retention-days: 14
          if-no-files-found: error
