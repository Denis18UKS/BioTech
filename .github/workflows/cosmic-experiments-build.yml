name: Build standalone Cosmic Experiments

on:
  push:
    branches:
      - chatgpt/cosmic-experiments-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout technical build branch
        uses: actions/checkout@v4

      - name: Restore standalone project
        shell: bash
        run: |
          cat cosmic_ci/payload.part* | tr -d '\n\r' | base64 --decode > /tmp/cosmic.tar.gz
          mkdir -p /tmp/cosmic
          tar -xzf /tmp/cosmic.tar.gz -C /tmp/cosmic
          cp gradlew gradlew.bat /tmp/cosmic/CosmicExperiments/
          cp -r gradle /tmp/cosmic/CosmicExperiments/
          chmod +x /tmp/cosmic/CosmicExperiments/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone mod
        working-directory: /tmp/cosmic/CosmicExperiments
        run: ./gradlew build --stacktrace

      - name: Package JAR and sources
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/dist
          cp /tmp/cosmic/CosmicExperiments/build/libs/*.jar /tmp/dist/CosmicExperiments.jar
          cd /tmp/cosmic
          zip -qr /tmp/dist/CosmicExperiments-sources.zip CosmicExperiments \
            -x 'CosmicExperiments/.gradle/*' 'CosmicExperiments/build/*' 'CosmicExperiments/run/*'
          cat > /tmp/dist/README.txt <<'EOF'
          Cosmic Experiments — standalone NeoForge 1.21.1 mod
          Separate from BioTech. Technical CI branch only; BioTech main is untouched.
          Scale: 1 space block = 1000 km. Solar-system distances/radii retain real relative proportions.
          EOF

      - name: Upload standalone artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CosmicExperiments-standalone
          path: /tmp/dist/*
          retention-days: 14
          if-no-files-found: error

