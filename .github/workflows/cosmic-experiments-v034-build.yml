name: Build Cosmic Experiments v0.3.4 celestial surface sky

on:
  push:
    branches:
      - chatgpt/cosmic-experiments-v034-celestial-sky
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout technical v0.3.4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify standalone v0.3.4
        shell: bash
        run: bash cosmic_ci/build_v034.sh

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CosmicExperiments-v0.3.4-celestial-sky
          path: /tmp/dist/*
          retention-days: 14
          if-no-files-found: error
