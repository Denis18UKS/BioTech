name: Build BioTech visual and DNA pipeline overhaul

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore asset generator and apply overhaul patch
        shell: bash
        run: |
          mkdir -p tools
          cat ci_payload/base_generator.b64.part* \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress > tools/generate_biotech_assets.py
          cat ci_payload/visual_dna_overhaul.b64.part* \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress > /tmp/visual-dna.patch
          patch --batch --forward -p1 < /tmp/visual-dna.patch

      - name: Generate all BioTech textures and models
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_biotech_assets.py

      - name: Point DNA injector forward in third person
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/main/resources/assets/biotech/models/item/dnk_injector_hand.json')
          model = json.loads(path.read_text(encoding='utf-8'))
          display = model.setdefault('display', {})

          # The injector model is built along its Z axis. Rotating it by ±90°
          # made it lie sideways across the player's body. Keep the existing
          # textures and first-person pose, and only align the third-person
          # model's Z axis with the player's look direction.
          display['thirdperson_righthand'] = {
              'rotation': [0, 0, 0],
              'translation': [0, 2.0, 1.0],
              'scale': [0.64, 0.64, 0.64]
          }
          display['thirdperson_lefthand'] = {
              'rotation': [0, 0, 0],
              'translation': [0, 2.0, 1.0],
              'scale': [0.64, 0.64, 0.64]
          }

          path.write_text(json.dumps(model, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Package patched sources and JAR
        if: success()
        run: |
          mkdir -p dist/source/BioTech
          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='bin' \
            --exclude='run' \
            --exclude='dist' \
            --exclude='ci_payload' \
            ./ dist/source/BioTech/
          (cd dist/source && zip -qr ../BioTech-visual-dna-sources.zip BioTech)
          cp build/libs/*.jar dist/
          cp BUILD-INFO.txt dist/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BioTech-visual-dna-overhaul
          path: dist/*
          if-no-files-found: error
          retention-days: 14
